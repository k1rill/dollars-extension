<!DOCTYPE html>
<html lang="be">
  <head>
    <meta charset="UTF-8" />
    <title>Ў далярах</title>
    <style>
      /* Іканачны шрыфт знака рубля — НБРБ: https://www.nbrb.by/coinsbanknotes/byn-ico/nbrb-font */
      @font-face {
        font-family: "nbrb";
        src:
          url("fonts/nbrb.woff2") format("woff2"),
          url("fonts/nbrb.woff") format("woff"),
          url("fonts/nbrb.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      .popup-nbrb-icon {
        font-family: "nbrb", sans-serif !important;
        font-style: normal;
        font-weight: normal;
        display: inline-block;
        font-size: 1.4em;
        line-height: 1;
        vertical-align: -0.02em;
        margin: 0;
        color: inherit;
      }
      .popup-nbrb-icon::before {
        content: "\e901";
      }
      /* Яўныя шрыфты з добрай кірыліцай / лацінкай (Chrome popup часам дае дзіўны fallback) */
      html,
      body,
      button,
      input {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      body {
        font-size: 13px;
        margin: 12px;
        min-width: 260px;
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
        font-weight: 600;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .section-title {
        font-size: 12px;
        font-weight: 600;
        color: #444;
        margin: 12px 0 6px;
      }
      #sitePickers {
        margin-left: 12px;
        padding-left: 8px;
        border-left: 2px solid #e8e8e8;
      }
      #sitePickers label {
        font-size: 12px;
        color: #333;
      }
      #sitePickers[hidden] {
        display: none;
      }
      .meta {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #e8e8e8;
        font-size: 12px;
        color: #555;
        line-height: 1.4;
      }
      .error {
        color: #b00020;
        margin-top: 8px;
      }
      button {
        margin-top: 8px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f6f6f6;
      }
      button:hover {
        background: #eee;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Ў далярах</h1>
    <p class="section-title">Сайты</p>
    <label>
      <input type="checkbox" id="sitesAll" checked />
      На всех поддерживаемых сайтах
    </label>
    <div id="sitePickers" hidden>
      <label>
        <input type="checkbox" id="siteAvBy" checked />
        av.by
      </label>
      <label>
        <input type="checkbox" id="siteOnliner" checked />
        catalog.onliner.by
      </label>
      <label>
        <input type="checkbox" id="siteVek21" checked />
        21vek.by
      </label>
    </div>
    <p class="section-title">Отображение</p>
    <label>
      <input type="checkbox" id="inline" />
      Показывать рядом с ценой
    </label>
    <label>
      <input type="checkbox" id="hover" />
      Показывать при наведении
    </label>
    <label>
      <input type="checkbox" id="showUsd" />
      В долларах (USD)
    </label>
    <label>
      <input type="checkbox" id="showEur" />
      В евро (EUR)
    </label>
    <button type="button" id="refresh">Обновить курсы НБРБ</button>
    <div class="meta" id="status">Загрузка…</div>
    <div class="error" id="err" hidden></div>
    <script src="popup.js"></script>
  </body>
</html>
