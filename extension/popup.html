<!DOCTYPE html>
<html lang="be">
  <head>
    <meta charset="UTF-8" />
    <title>Ў далярах</title>
    <style>
      /* Яўныя шрыфты з добрай кірыліцай / лацінкай (Chrome popup часам дае дзіўны fallback) */
      html,
      body,
      button,
      input {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      body {
        font-size: 13px;
        margin: 12px;
        min-width: 260px;
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
        font-weight: 600;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .meta {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #e8e8e8;
        font-size: 12px;
        color: #555;
        line-height: 1.4;
      }
      .error {
        color: #b00020;
        margin-top: 8px;
      }
      button {
        margin-top: 8px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f6f6f6;
      }
      button:hover {
        background: #eee;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .popup-byn-icon {
        display: inline-block;
        height: 0.88em;
        width: auto;
        aspect-ratio: 360.67 / 446.4;
        margin: 0;
        vertical-align: -0.12em;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Ў далярах</h1>
    <label>
      <input type="checkbox" id="inline" />
      Показывать рядом с ценой
    </label>
    <label>
      <input type="checkbox" id="hover" />
      Показывать при наведении
    </label>
    <button type="button" id="refresh">Обновить курсы НБРБ</button>
    <div class="meta" id="status">Загрузка…</div>
    <div class="error" id="err" hidden></div>
    <script src="popup.js"></script>
  </body>
</html>
